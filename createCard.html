<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz App</title>
    <link rel="icon" href="./assets/icons/favicon.png" type="image/png" sizes="32x32">

    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">

    <script src="./js/data.js" defer></script>
    <script src="./js/global.js" defer></script>
    <script src="./js/card.js" defer></script>
    <script src="./js/nav.js" defer></script>
    <script src="./js/createCard.js" defer></script>
</head>

<body>
<header class="header">
    <h1 class="header__title">QUIZ APP </h1>
</header>

<main class="main">
    <div class="quiz__card">
        <form
                data-js="form"
                class="quiz__card__form">
            <div class="form-group">
                <label
                        for="question"
                        class="form-label">
                    Question:
                </label>
                <input
                        id="question"
                        data-js="question"
                        type="text"
                        class="form-control"
                        placeholder="Insert your question ..."
                        required />
            </div>

            <div class="form-group">
                <label
                        for="answer"
                        class="form-label">
                    Answer:
                </label>
                <input
                        id="answer"
                        data-js="question"
                        type="text"
                        class="form-control"
                        placeholder="Insert your answer ..."
                        required />
            </div>

            <fieldset class="quiz__card__fieldset">
                <legend>
                    Possible answers:
                </legend>

                <div class="form-group divAnswers">
                    <label
                            for="possibleAnswer1"
                            class="form-label">
                        First animal:
                    </label>
                    <input
                            id="possibleAnswer1"
                            data-js="possibleAnswer1"
                            type="text"
                            class="form-control"
                            placeholder="Insert your first animal ..."
                            required />
                </div>
                <div class="form-group divAnswers">
                    <label
                            for="possibleAnswer2"
                            class="form-label">
                        Second animal:
                    </label>
                    <input
                            id="possibleAnswer2"
                            data-js="possibleAnswer2"
                            type="text"
                            class="form-control"
                            placeholder="Insert your second animal ..."
                            required />
                </div>
                <div class="form-group divAnswers">
                    <label
                            for="possibleAnswer3"
                            class="form-label">
                        Third animal:
                    </label>
                    <input
                            id="possibleAnswer3"
                            data-js="possibleAnswer3"
                            type="text"
                            class="form-control"
                            placeholder="Insert your third animal ..."
                            required />
                </div>
                <div class="form-group">
                    <label
                            for="possibleAnswer4"
                            class="form-label">
                        Forth animal:
                    </label>
                    <input
                            id="possibleAnswer4"
                            data-js="possibleAnswer4"
                            type="text"
                            class="form-control"
                            placeholder="Insert your forth animal ..."
                            required />
                </div>
                <div class="button__container">
                    <button
                            type="submit"
                            class="button button--show-answer button__text">
                        Submit
                    </button>
                    <button
                            type="reset"
                            class="button button--show-answer button__text">
                        Reset
                    </button>
                </div>
            </fieldset>
        </form>
    </div>
</main>
<nav aria-label="main navigation" class="nav"></nav>
</body>
</html>
